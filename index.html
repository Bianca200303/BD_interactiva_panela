<style>
/* Layout: barra superior + índice de módulos a la izquierda + lienzo con zoom; ficha de la tabla flotando a la derecha */
:root{
  --bg:#eef4f5; --canvas:#f6fafb; --surface:#ffffff; --ink:#0d2a33; --muted:#4b6d76;
  --line:#cfdfe3; --dot:#c4d8dd; --accent:#0f4c5c; --hl:#d97706; --edge:#8fb3bc; --onc:#ffffff; --prop:#7c3aed;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,'Courier New',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1b20; --canvas:#0e2228; --surface:#132c33; --ink:#e2eff2; --muted:#8fb0b8;
  --line:#24454e; --dot:#1f3d45; --accent:#6fbccc; --hl:#f59e0b; --edge:#3f6b76; --onc:#ffffff; --prop:#a78bfa; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1b20; --canvas:#0e2228; --surface:#132c33; --ink:#e2eff2; --muted:#8fb0b8;
  --line:#24454e; --dot:#1f3d45; --accent:#6fbccc; --hl:#f59e0b; --edge:#3f6b76; --onc:#ffffff; --prop:#a78bfa; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-bottom:1px solid var(--line)}
.mark{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:18px;height:18px}
h1{font-size:16px;font-weight:600;margin:0;text-wrap:balance}
.stats{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}
#lt{display:none;margin-left:auto;padding:6px 12px;border:1px solid var(--line);border-radius:6px;font-weight:500}
main{display:grid;grid-template-columns:300px 1fr;min-height:0;position:relative}
aside{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sh{padding:14px 16px 10px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.sh label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.srow{display:flex;gap:8px}
#q{flex:1;min-width:0;font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--canvas);color:var(--ink)}
#all{padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap}
#count{font-size:12px;color:var(--hl);min-height:0}
#count:empty{display:none}
#list{overflow:auto;padding:8px 8px 16px;flex:1;min-height:0}
.grp{margin-bottom:4px}
.gh{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 8px;border-radius:6px;font-weight:600;font-size:13px}
.gh:hover,.grp.on .gh{background:color-mix(in srgb,var(--gc) 12%,transparent)}
.gh i,.rels i{width:10px;height:10px;border-radius:3px;background:var(--gc);flex:none}
.gh span{flex:1;min-width:0}
.gh em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500}
.grp ul{list-style:none;margin:0 0 6px;padding:0 0 0 26px}
.ti{display:block;width:100%;text-align:left;font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:4px;color:var(--muted);overflow-wrap:anywhere}
.ti:hover{color:var(--ink);background:var(--canvas)}
.ti.on{color:var(--onc);background:var(--accent)}
.ti small{display:block;font-size:11px;color:var(--hl)}
.ti.on small{color:var(--onc)}
.empty{color:var(--muted);font-size:13px;padding:8px}
.legend{border-top:1px solid var(--line);padding:10px 16px 12px;font-size:12px;color:var(--muted);display:grid;gap:4px}
.legend b{font-family:var(--mono);font-size:10px;padding:0 4px;border-radius:3px;color:var(--onc);background:var(--accent)}
.legend b.fk{background:var(--hl)}
.legend b.prop{background:var(--prop)}
.legend svg.prop{stroke:var(--prop)}
.legend svg{width:34px;height:14px;vertical-align:middle;margin-right:6px;stroke:var(--muted);fill:none;stroke-width:1.3}
#vp{position:relative;overflow:hidden;touch-action:none;cursor:grab;background-color:var(--canvas);
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);min-width:0}
#vp.panning{cursor:grabbing}
#vp.dragging{cursor:move}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world.anim{transition:transform .35s ease}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
.edge path{fill:none;stroke:var(--edge);stroke-width:1.3;vector-effect:non-scaling-stroke}
.edge .m{fill:none;stroke:var(--edge);stroke-width:1.3;vector-effect:non-scaling-stroke}
.edge.hide{display:none}
.edge.prop path{stroke:var(--prop);stroke-dasharray:6 4}
.edge.prop .m{stroke:var(--prop);stroke-dasharray:none}
.edge.prop.on path{stroke:var(--prop);stroke-width:2.6}
.edge.prop.on .m{stroke:var(--prop)}
.edge.on path{stroke:var(--hl);stroke-width:2.6}
.edge.on .m{stroke:var(--hl);stroke-width:2.2}
.edge.off{opacity:.06}
.frame{position:absolute;border:1.5px solid color-mix(in srgb,var(--gc) 50%,transparent);
  background:color-mix(in srgb,var(--gc) 7%,transparent);border-radius:14px;transition:opacity .2s}
.frame .lbl{position:absolute;left:14px;bottom:100%;padding-bottom:.35em;max-width:calc(100% - 28px);
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;text-wrap:balance;
  font-size:max(22px,calc(13px / var(--k,1)));font-weight:600;color:color-mix(in srgb,var(--gc) 75%,var(--ink));line-height:1.1}
.frame .lbl small{font-family:var(--mono);font-weight:500;font-size:.6em;margin-left:.6em;color:var(--muted)}
.frame.dim{opacity:.3}
.card{position:absolute;width:232px;background:var(--surface);border:1px solid var(--line);border-radius:6px;
  box-shadow:0 1px 3px color-mix(in srgb,var(--accent) 14%,transparent);font-family:var(--mono);font-size:11.5px;
  padding-bottom:8px;transition:opacity .2s;user-select:none}
.card .h{height:30px;background:var(--gc);color:var(--onc);display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:0 10px;font-weight:600;border-radius:5px 5px 0 0;cursor:grab}
.card .h span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .h em{font-style:normal;font-weight:400;opacity:.8;font-size:10.5px}
.row{height:20px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 10px}
.row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px}
.row .t{color:var(--muted);white-space:nowrap;font-size:10.5px}
.row.pk .n{font-weight:600}
.key{font-size:9px;font-weight:600;padding:0 3px;border-radius:3px;color:var(--onc);background:var(--accent);line-height:14px}
.key.fk{background:var(--hl)}
.key.prop{background:var(--prop)}
.row.m{background:color-mix(in srgb,var(--hl) 22%,transparent)}
.card.dim{opacity:.16}
.card.sel{outline:3px solid var(--hl);outline-offset:1px;z-index:2}
.card.rel{outline:2px solid color-mix(in srgb,var(--hl) 60%,transparent);outline-offset:1px;z-index:1}
.card.hit{outline:2px dashed var(--hl);outline-offset:2px}
.ctl{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctl button{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:34px;height:34px;padding:0 10px;font-weight:500;font-size:13px}
.ctl button:hover{border-color:var(--accent)}
.ctl button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onc)}
#zl{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 8px;height:34px;display:grid;place-items:center;min-width:52px}
.hint{position:absolute;right:12px;bottom:12px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--surface) 88%,transparent);padding:6px 10px;border-radius:6px;max-width:min(420px,60%);pointer-events:none}
#detail{position:absolute;right:12px;top:12px;bottom:12px;width:380px;max-width:calc(100% - 24px);overflow:auto;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 22%,transparent);z-index:5}
.dh{padding:16px 18px 14px;border-bottom:1px solid var(--line);border-top:5px solid var(--gc);border-radius:10px 10px 0 0;position:relative}
.dh h2{font-family:var(--mono);font-size:18px;margin:8px 0 4px;overflow-wrap:anywhere;padding-right:30px}
.dh p{margin:0;color:var(--muted);font-size:12.5px}
.mod{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:color-mix(in srgb,var(--gc) 75%,var(--ink));
  background:color-mix(in srgb,var(--gc) 13%,transparent);padding:3px 8px;border-radius:999px;display:inline-block}
.x{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:6px;font-size:20px;line-height:1;color:var(--muted)}
.x:hover{background:var(--canvas);color:var(--ink)}
#detail h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 18px 8px;font-weight:600}
#detail h3 em{font-style:normal;font-family:var(--mono);color:var(--ink);margin-left:4px}
.cols{width:calc(100% - 36px);margin:0 18px;border-collapse:collapse;font-size:12px}
.cols th{text-align:left;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding:4px 6px;border-bottom:1px solid var(--line)}
.cols td{padding:4px 6px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);vertical-align:top;font-family:var(--mono);overflow-wrap:anywhere}
.cols td:nth-child(2){color:var(--muted)}
.b{display:inline-block;font-family:var(--sans);font-size:10px;font-weight:600;padding:1px 5px;border-radius:3px;margin:0 3px 2px 0;
  color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
.b.pk{color:var(--onc);background:var(--accent)}
.b.fk{color:var(--onc);background:var(--hl)}
.b.prop{color:var(--onc);background:var(--prop)}
.rels button.prop em{color:var(--prop)}
.rels{list-style:none;margin:0;padding:0 12px 4px;display:grid;gap:2px}
.rels button{display:grid;grid-template-columns:10px 1fr auto;column-gap:9px;align-items:center;width:100%;text-align:left;padding:7px 6px;border-radius:6px}
.rels button:hover{background:var(--canvas)}
.rels strong{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.rels span{grid-column:2/4;font-family:var(--mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.rels em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--hl);font-weight:600;grid-row:1;grid-column:3}
.none{margin:0 18px;color:var(--muted);font-size:12.5px}
.pad{height:14px}
@media (max-width:760px){
  #lt{display:inline-block}
  main{grid-template-columns:1fr}
  aside{position:absolute;inset:0 auto 0 0;width:min(320px,88%);z-index:8;transform:translateX(-102%);transition:transform .25s;box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 25%,transparent)}
  aside.open{transform:none}
  #detail{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-width:none;height:56%}
  .hint{display:none}
  .stats{width:100%;order:3}
}
@media (prefers-reduced-motion:reduce){#world.anim,aside,.card,.frame{transition:none}}
</style>

<div class="app">
  <header>
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 18 18" fill="none" stroke="#ffffff" stroke-width="1.6"><rect x="1.5" y="2" width="6.5" height="6" rx="1"/><rect x="10" y="10" width="6.5" height="6" rx="1"/><path d="M8 5h3.2a1.6 1.6 0 0 1 1.6 1.6V10"/></svg></div>
    <h1>BD Trazabilidad Panela</h1>

  <main>
    <aside id="side">
      <div class="sh">
        <label for="q">Buscar tabla o columna</label>
        <div class="srow"><input id="q" type="search" placeholder="p. ej. container, batch_id" autocomplete="off"><button id="all" type="button">Ver todo</button></div>
        <div id="count"></div>
      </div>
      <div id="list"></div>
    </aside>
    <div id="vp">
      <div id="world"><svg id="edges"></svg><div id="frames"></div><div id="cards"></div></div>
      <div class="ctl">
        <button id="zo" type="button" aria-label="Alejar">−</button>
        <span id="zl">100%</span>
        <button id="zi" type="button" aria-label="Acercar">+</button>
        <button id="fit" type="button">Ajustar</button>
        <button id="reset" type="button">Reordenar</button>
        <button id="hub" type="button" aria-pressed="false" title="Relaciones hacia cooperatives, coop_modules, users y web_users">Relaciones generales</button>

      <div id="detail" hidden></div>
    </div>
  </main>
</div>

function layout(){
  const pos={};let x=0,y=0,rowH=0;
  for(const g of D.groups){
    const ts=g.tables.map(n=>T.get(n));
    const total=ts.reduce((a,t)=>a+hgt(t)+GAP,0);
    const K=Math.max(1,Math.min(ts.length,Math.round(Math.sqrt(total/(W+GAP)*1.15))));
    const colH=new Array(K).fill(0),local={};
    [...ts].sort((a,b)=>hgt(b)-hgt(a)).forEach(t=>{const k=colH.indexOf(Math.min(...colH));local[t.n]={x:k*(W+GAP),y:colH[k]};colH[k]+=hgt(t)+GAP;});
    const gw=K*(W+GAP)-GAP+GP*2,gh=Math.max(...colH)-GAP+GT+GP;
    if(x>0&&x+gw>MAXW){x=0;y+=rowH+ROWGAP;rowH=0;}
    for(const n in local)pos[n]={x:x+GP+local[n].x,y:y+GT+local[n].y};
    x+=gw+GP*3;rowH=Math.max(rowH,gh);
  }
  return pos;
}

const cardEl={},rowEl={},frameEl={};
for(const g of D.groups){
  const el=document.createElement('div');el.className='frame';el.style.setProperty('--gc',g.color);
  el.innerHTML=`<div class="lbl">${esc(g.name)}<small>${g.tables.length} tablas</small></div>`;
  $('#frames').append(el);frameEl[g.id]=el;
}
for(const t of D.tables){
  const g=G.get(t.g),el=document.createElement('div');
  el.className='card';el.dataset.n=t.n;el.style.setProperty('--gc',g?g.color:'var(--accent)');
  el.innerHTML=`<div class="h"><span>${esc(t.n)}</span><em>${t.f.length}</em></div>`+t.f.map(f=>
    `<div class="row${f.pk?' pk':''}"><span class="n">${f.pk?'<b class="key">PK</b>':f.fk?'<b class="key fk">FK</b>':f.prop?'<b class="key prop">FK?</b>':''}${esc(f.n)}</span><span class="t">${esc(f.t)}</span></div>`).join('');
  $('#cards').append(el);cardEl[t.n]=el;rowEl[t.n]=[...el.querySelectorAll('.row')];
}
const NS='http://www.w3.org/2000/svg';
const edgeEls=D.refs.map(r=>{const g=document.createElementNS(NS,'g');g.setAttribute('class',r.prop?'edge prop':'edge');
  const p=document.createElementNS(NS,'path'),ma=document.createElementNS(NS,'path'),mb=document.createElementNS(NS,'path');
  ma.setAttribute('class','m');mb.setAttribute('class','m');g.append(p,ma,mb);svg.append(g);return{g,p,ma,mb};});
// Notación pata de gallo; d es el sentido hacia fuera de la tarjeta
const crow=(x,y,d,many)=>many?`M${x},${y-6}L${x+d*9},${y}L${x},${y+6}M${x+d*13},${y-6}V${y+6}`:`M${x+d*7},${y-6}V${y+6}`;
const one=(x,y,d)=>`M${x+d*7},${y-6}V${y+6}M${x+d*11},${y-6}V${y+6}`;

function gbox(id){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  G.get(id).tables.forEach(n=>{const p=pos[n];x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x+W);y1=Math.max(y1,p.y+hgt(T.get(n)));});
  return{x:x0-GP,y:y0-GT,w:x1-x0+2*GP,h:y1-y0+GT+GP};}
function placeFrames(){for(const id in frameEl){const b=gbox(id),s=frameEl[id].style;s.left=b.x+'px';s.top=b.y+'px';s.width=b.w+'px';s.height=b.h+'px';}}
function anchorY(e){const t=T.get(e.t),i=t.f.findIndex(f=>f.n===e.c[0]);return pos[e.t].y+1+(i<0?HH/2:HH+i*RH+RH/2);}
function drawEdge(i){
  const r=D.refs[i],A=r.fk,B=r.pk,pa=pos[A.t],pb=pos[B.t],E=edgeEls[i];
  if(!pa||!pb){E.g.style.display='none';return;}
  const ya=anchorY(A),yb=anchorY(B);let xa,xb,da,db;
  if(A.t===B.t){xa=xb=pa.x+W;da=db=1;}
  else{const ca=pa.x+W/2,cb=pb.x+W/2;
    if(Math.abs(ca-cb)<W*.7){xa=pa.x+W;xb=pb.x+W;da=db=1;}
    else if(ca<cb){xa=pa.x+W;da=1;xb=pb.x;db=-1;}else{xa=pa.x;da=-1;xb=pb.x+W;db=1;}}
  const k=Math.max(45,Math.abs(xb-xa)*.45);
  E.p.setAttribute('d',`M${xa},${ya}C${xa+da*k},${ya} ${xb+db*k},${yb} ${xb},${yb}`);
  E.ma.setAttribute('d',crow(xa,ya,da,A.r!=='1'));E.mb.setAttribute('d',one(xb,yb,db));
}
function placeCard(n){const s=cardEl[n].style;s.left=pos[n].x+'px';s.top=pos[n].y+'px';}
function placeAll(){for(const n in cardEl)placeCard(n);placeFrames();D.refs.forEach((_,i)=>drawEdge(i));}

let V={x:0,y:0,k:1};
function setView(){world.style.transform=`translate(${V.x}px,${V.y}px) scale(${V.k})`;world.style.setProperty('--k',V.k);
  const s=22*V.k;vp.style.backgroundSize=`${s}px ${s}px`;vp.style.backgroundPosition=`${V.x}px ${V.y}px`;$('#zl').textContent=Math.round(V.k*100)+'%';}
function animate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;world.classList.add('anim');clearTimeout(animate.t);animate.t=setTimeout(()=>world.classList.remove('anim'),380);}
function zoomAt(cx,cy,f){const k=Math.min(2.5,Math.max(.05,V.k*f));f=k/V.k;V.x=cx-(cx-V.x)*f;V.y=cy-(cy-V.y)*f;V.k=k;setView();}
function avail(){const r=vp.getBoundingClientRect(),narrow=r.width<=760,open=!detail.hidden;
  return{w:r.width-(open&&!narrow?400:0),h:open&&narrow?r.height*.42:r.height,r};}
function fitBox(b,max){const a=avail(),m=36,top=70;const k=Math.max(.05,Math.min(max||1,(a.w-2*m)/b.w,(a.h-m-top)/b.h));
  V.k=k;V.x=(a.w-b.w*k)/2-b.x*k;V.y=top+(a.h-top-m-b.h*k)/2-b.y*k;animate();setView();}
function allBox(){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const id in frameEl){const b=gbox(id);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h);}return{x:x0,y:y0,w:x1-x0,h:y1-y0};}
function centerOn(n){const a=avail(),p=pos[n],k=Math.max(V.k,.85),ch=hgt(T.get(n))*k;
  V.k=k;V.x=a.w/2-(p.x+W/2)*k;V.y=ch>a.h-80?40-p.y*k:a.h/2-(p.y*k+ch/2);animate();setView();}

let sel=null,query='',focusG=null;
function match(t,q){if(t.n.toLowerCase().includes(q))return{name:1};const cols=t.f.filter(f=>f.n.toLowerCase().includes(q)).map(f=>f.n);return cols.length?{cols}:null;}
function apply(){
  const q=query;const rel=new Set(),on=new Set();
  if(sel){rel.add(sel);(T.get(sel).refs||[]).forEach(i=>{on.add(i);D.refs[i].forEach(e=>rel.add(e.t));});}
  let vis=null;
  if(!sel&&q){vis=new Set(D.tables.filter(t=>match(t,q)).map(t=>t.n));}
  else if(!sel&&focusG){vis=new Set(G.get(focusG).tables);}
  for(const t of D.tables){const el=cardEl[t.n];
    el.classList.toggle('sel',t.n===sel);
    el.classList.toggle('rel',!!sel&&t.n!==sel&&rel.has(t.n));
    el.classList.toggle('dim',sel?!rel.has(t.n):!!vis&&!vis.has(t.n));
    el.classList.toggle('hit',!sel&&!!q&&!!vis&&vis.has(t.n));
    rowEl[t.n].forEach((r,i)=>r.classList.toggle('m',!!q&&t.f[i].n.toLowerCase().includes(q)));
  }
  for(const id in frameEl)frameEl[id].classList.toggle('dim',!!focusG&&!sel&&!q&&id!==focusG);
  edgeEls.forEach((E,i)=>{const r=D.refs[i];E.g.classList.toggle('on',on.has(i));
    E.g.classList.toggle('hide',(r.hub&&!showHub&&!on.has(i))||(r.prop&&!showProp));
    E.g.classList.toggle('off',sel?!on.has(i):!!vis&&!(vis.has(r.fk.t)&&vis.has(r.pk.t)));});
}
function renderList(){
  const q=query;let html='',n=0;
  for(const g of D.groups){
    const items=g.tables.map(x=>T.get(x)).map(t=>[t,q?match(t,q):{}]).filter(x=>x[1]);
    if(!items.length)continue;n+=items.length;
    html+=`<section class="grp${focusG===g.id?' on':''}" style="--gc:${g.color}"><button class="gh" type="button" data-g="${g.id}"><i></i><span>${esc(g.name)}</span><em>${q?items.length+'/':''}${g.tables.length}</em></button><ul>`+
      items.map(([t,m])=>`<li><button class="ti${t.n===sel?' on':''}" type="button" data-t="${esc(t.n)}">${esc(t.n)}${m.cols?`<small>columna: ${m.cols.slice(0,3).map(esc).join(', ')}${m.cols.length>3?' …':''}</small>`:''}</button></li>`).join('')+'</ul></section>';
  }
  list.innerHTML=html||`<p class="empty">Ninguna tabla ni columna contiene “${esc(q)}”. Pruebe con otra palabra.</p>`;
  $('#count').textContent=q?`${n} ${n===1?'tabla coincide':'tablas coinciden'}`:'';
}
function relList(rs,dir){
  if(!rs.length)return`<p class="none">${dir==='out'?'No apunta a otras tablas.':'Ninguna tabla apunta a esta.'}</p>`;
  return'<ul class="rels">'+rs.map(r=>{const o=dir==='out'?r.pk:r.fk,g=G.get(T.get(o.t)?.g);
    const via=dir==='out'?`${r.fk.c.join(', ')} → ${r.pk.t}.${r.pk.c.join(', ')}`:`${r.fk.t}.${r.fk.c.join(', ')} → ${r.pk.c.join(', ')}`;
    const card=r.prop?'propuesta':r.fk.r==='1'&&r.pk.r==='1'?'1:1':'N:1';
    return`<li><button type="button"${r.prop?' class="prop"':''} data-t="${esc(o.t)}" style="--gc:${g?g.color:'var(--accent)'}"><i></i><strong>${esc(o.t)}</strong><em>${card}</em><span>${esc(via)}</span></button></li>`;}).join('')+'</ul>';
}
function renderDetail(n){
  const t=T.get(n),g=G.get(t.g),out=[],inc=[];
  (t.refs||[]).forEach(i=>{const r=D.refs[i];if(r.fk.t===n)out.push(r);if(r.pk.t===n&&r.fk.t!==n)inc.push(r);});
  detail.style.setProperty('--gc',g?g.color:'var(--accent)');
  detail.innerHTML=`<div class="dh"><button class="x" type="button" data-close aria-label="Cerrar ficha">×</button>
    ${g?`<button class="mod" type="button" data-g="${g.id}">${esc(g.name)}</button>`:''}<h2>${esc(n)}</h2>
    <p>${t.f.length} columnas · ${out.length+inc.length} relaciones</p></div>
    <h3>Columnas</h3><table class="cols"><thead><tr><th>Columna</th><th>Tipo</th><th>Claves</th></tr></thead><tbody>${t.f.map(f=>
      `<tr><td>${esc(f.n)}</td><td>${esc(f.t)}</td><td>${[f.pk&&'<b class="b pk">PK</b>',f.fk&&'<b class="b fk">FK</b>',f.prop&&'<b class="b prop">FK? propuesta</b>',f.u&&'<b class="b">Único</b>',f.nn&&!f.pk&&'<b class="b">Obligatorio</b>'].filter(Boolean).join('')}</td></tr>`).join('')}</tbody></table>
    <h3>Apunta a<em>${out.length}</em></h3>${relList(out,'out')}
    <h3>Tablas que apuntan a esta<em>${inc.length}</em></h3>${relList(inc,'in')}<div class="pad"></div>`;
  detail.scrollTop=0;
}
function select(n,center=true){
  sel=n&&T.has(n)?n:null;detail.hidden=!sel;
  if(sel){renderDetail(sel);if(center)centerOn(sel);}
  apply();renderList();
}
function focusGroup(id){focusG=focusG===id?null:id;sel=null;detail.hidden=true;
  if(focusG)fitBox(gbox(focusG),1);else fitBox(allBox());apply();renderList();closeSide();}
function closeSide(){$('#side').classList.remove('open');}

list.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.g)focusGroup(b.dataset.g);else if(b.dataset.t){select(b.dataset.t);closeSide();}});
detail.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if('close' in b.dataset)select(null);else if(b.dataset.t)select(b.dataset.t);else if(b.dataset.g)focusGroup(b.dataset.g);});
qEl.addEventListener('input',()=>{query=qEl.value.trim().toLowerCase();if(sel){sel=null;detail.hidden=true;}apply();renderList();});
qEl.addEventListener('keydown',e=>{if(e.key==='Enter'){const f=list.querySelector('.ti');if(f){select(f.dataset.t);closeSide();}}});
$('#all').addEventListener('click',()=>{qEl.value='';query='';focusG=null;select(null);fitBox(allBox());closeSide();});
$('#fit').addEventListener('click',()=>fitBox(focusG&&!sel?gbox(focusG):allBox(),focusG?1:undefined));
$('#zi').addEventListener('click',()=>{const a=avail();animate();zoomAt(a.w/2,a.h/2,1.3);});
$('#zo').addEventListener('click',()=>{const a=avail();animate();zoomAt(a.w/2,a.h/2,1/1.3);});
$('#reset').addEventListener('click',()=>{pos=layout();try{localStorage.removeItem(KEY)}catch(e){}placeAll();fitBox(allBox());});
const hubBtn=$('#hub');hubBtn.setAttribute('aria-pressed',showHub);
hubBtn.addEventListener('click',()=>{showHub=!showHub;hubBtn.setAttribute('aria-pressed',showHub);try{localStorage.setItem(KEY+'-hub',showHub?'1':'0')}catch(e){}apply();});
$('#lt').addEventListener('click',()=>$('#side').classList.toggle('open'));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(sel)select(null);else closeSide();}});

const ptrs=new Map();let mode=null,st=null,moved=false,pinchD=0,raf=0;
vp.addEventListener('pointerdown',e=>{
  if(e.target.closest('.ctl,#detail'))return;
  if(e.button!==undefined&&e.button>0)return;
  vp.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  world.classList.remove('anim');
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinchD=Math.hypot(a.x-b.x,a.y-b.y);mode='pinch';return;}
  const card=e.target.closest('.card');moved=false;
  st={x:e.clientX,y:e.clientY,vx:V.x,vy:V.y,card:card?card.dataset.n:null};
  if(card&&(e.pointerType==='mouse'||e.target.closest('.h'))){mode='drag';st.px=pos[st.card].x;st.py=pos[st.card].y;}else mode='pan';
});
vp.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(mode==='pinch'){if(ptrs.size<2)return;const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),r=vp.getBoundingClientRect();
    zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,d/pinchD);pinchD=d;return;}
  if(!mode)return;
  const dx=e.clientX-st.x,dy=e.clientY-st.y;
  if(!moved&&Math.hypot(dx,dy)>4){moved=true;vp.classList.add(mode==='drag'?'dragging':'panning');}
  if(!moved)return;
  if(mode==='pan'){V.x=st.vx+dx;V.y=st.vy+dy;setView();}
  else{const n=st.card;pos[n]={x:st.px+dx/V.k,y:st.py+dy/V.k};placeCard(n);
    if(!raf)raf=requestAnimationFrame(()=>{raf=0;placeFrames();(T.get(n).refs||[]).forEach(drawEdge);});}
});
function up(e){
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(ptrs.size){if(mode==='pinch')mode=null;return;}
  vp.classList.remove('dragging','panning');
  if(mode&&mode!=='pinch'&&!moved){if(st.card)select(st.card,false);else if(sel)select(null);}
  if(mode==='drag'&&moved){placeFrames();(T.get(st.card).refs||[]).forEach(drawEdge);savePos();}
  mode=null;
}
vp.addEventListener('pointerup',up);vp.addEventListener('pointercancel',up);
vp.addEventListener('wheel',e=>{e.preventDefault();world.classList.remove('anim');const r=vp.getBoundingClientRect();
  zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*(e.deltaMode===1?.05:.0018)));},{passive:false});

function fromHash(){const h=decodeURIComponent(location.hash.slice(1));if(T.has(h))select(h);}
placeAll();renderList();apply();
requestAnimationFrame(()=>{fitBox(allBox());world.classList.remove('anim');fromHash();});
addEventListener('hashchange',fromHash);
})();
</script>
